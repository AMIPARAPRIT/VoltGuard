# VoltGuard Configuration — Phase 1 through Phase 5
# Centralized configuration for all safety limits, system parameters, and subsystem binaries.
# Do NOT scatter these values throughout the codebase.

voltguard:
  version: "0.5.0"
  service_name: "VoltGuard Backend"
  mode: "offline"  # offline | online | hybrid

# Physical safety limits for the industrial process.
# Units: pressure=bar, rpm=RPM, temperature=°C, flow=L/min, stress=MPa
safety_limits:
  max_pressure: 80.0          # bar  — pipeline burst threshold (prototype scale)
  max_rpm: 3600               # RPM  — motor overspeed limit
  max_temperature: 120.0      # °C   — fluid temperature limit
  max_flow: 500.0             # L/min
  max_stress: 130.0           # MPa  — hoop stress limit

# Physics engine model parameters.
physics:
  reference_rpm: 3000.0         # RPM at which base_flow is defined
  base_flow: 300.0              # L/min at reference_rpm, full valve, 100% efficiency
  default_pump_efficiency: 0.85 # fractional (0–1)
  default_pipeline_resistance: 1.0  # dimensionless resistance coefficient
  pressure_gain_coefficient: 0.0016    # bar / (L/min)^2
  pressure_loss_coefficient: 0.0002    # bar / (L/min) per resistance unit
  thermal_gain_coefficient: 0.04       # °C / (L/min)
  stress_per_bar: 1.55                 # MPa / bar

decision_engine:
  executable: "build/decision_engine.exe"
  timeout_ms: 1000

database:
  url: "sqlite:///data/voltguard.db"

server:
  host: "0.0.0.0"
  port: 8000
