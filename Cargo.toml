[package]
name = "voltguard_decision_engine"
version = "0.1.0"
edition = "2021"
authors = ["VoltGuard Team"]
description = "High-speed decision and policy engine for VoltGuard"

[[bin]]
name = "decision_engine"
path = "decision_engine/src/main.rs"

[lib]
name = "voltguard_decision_engine"
path = "decision_engine/src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
